<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" fill="none">
  <!-- 1. THE "i" ENGINEER MARK -->
  <g id="engineer-mark">
    <!-- Main Safety Helmet Dome -->
    <path d="M32 40 C32 18 42 8 58 8 C74 8 84 18 84 40 Z" fill="#C1F24F" />
    <!-- Helmet Center Ridge Crest -->
    <path d="M53 8 C53 8 53 38 53 40 L63 40 C63 38 63 8 63 8 Z" fill="#A7DE2B" opacity="0.6" />
    <!-- Helmet Side Grooves -->
    <path d="M42 16 C42 16 41 38 41 40 L45 40 C45 38 46 16 46 16 Z" fill="#A7DE2B" opacity="0.35" />
    <path d="M74 16 C74 16 75 38 75 40 L71 40 C71 38 70 16 70 16 Z" fill="#A7DE2B" opacity="0.35" />
    <!-- Helmet Curved Base Brim -->
    <rect x="24" y="38" width="68" height="8" rx="4" fill="#C1F24F" />
    <!-- Head Disc / Circle in Deep Teal -->
    <circle cx="58" cy="60" r="19" fill="#056D67" />
    <!-- Body Columns forming the 'i' stem -->
    <path d="M24 74 C35 74 38 78 38 88 L38 126 C38 136 35 140 24 140 L51 140 L51 86 L39 74 Z" fill="#056D67" />
    <path d="M92 74 C81 74 78 78 78 88 L78 126 C78 136 81 140 92 140 L65 140 L65 86 L77 74 Z" fill="#056D67" />
  </g>

  <!-- 2. THE "M A N" LETTERS -->
  <g id="letters">
    <!-- Letter M -->
    <path d="M106 74 L127 74 L158 114 L189 74 L210 74 L210 140 L190 140 L190 98 L163 133 L153 133 L126 98 L126 140 L106 140 Z" fill="#056D67" />
    <!-- Letter A with Lime Accent Triangle -->
    <path d="M218 140 L260 74 L292 74 L334 140 L312 140 L301 122 L251 122 L240 140 Z M261 106 L291 106 L276 82 Z" fill="#056D67" />
    <polygon points="276,96 254,138 298,138" fill="#C1F24F" />
    <!-- Letter N -->
    <path d="M344 74 L365 74 L412 119 L412 74 L432 74 L432 140 L411 140 L364 95 L364 140 L344 140 Z" fill="#056D67" />
  </g>

  <!-- 3. SUBTITLE: "SERVICE COMPANY" -->
  <line x1="24" y1="154" x2="95" y2="154" stroke="#C1F24F" stroke-width="3.5" stroke-linecap="round" />
  <text x="260" y="158" text-anchor="middle" fill="#056D67" font-size="16" font-weight="700" font-family="system-ui, -apple-system, sans-serif" letter-spacing="8">SERVICE COMPANY</text>
  <line x1="425" y1="154" x2="496" y2="154" stroke="#C1F24F" stroke-width="3.5" stroke-linecap="round" />
</svg>
